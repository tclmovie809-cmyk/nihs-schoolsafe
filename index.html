<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIHS SCHOOLSAFE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #16002b, #4b0082, #7b2cbf);
      color: white;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
    }

    .box {
      width: 100%;
      max-width: 500px;
      animation: fadeIn 1s ease;
    }

    .logo {
      width: 180px;
      height: 180px;
      object-fit: contain;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 38px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    button {
      border: none;
      padding: 15px 50px;
      border-radius: 30px;
      background: white;
      color: #4b0082;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.96);
    }

    .hidden {
      display: none;
    }

    .choice {
      display: block;
      width: 100%;
      margin: 15px 0;
      padding: 18px;
      border-radius: 15px;
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <!-- WELCOME SCREEN -->
  <div class="screen" id="welcomeScreen">
    <div class="box">

      <img src="school-logo.jpg" class="logo" alt="NIHS School Logo">

      <h1>NIHS SCHOOLSAFE</h1>

      <p>
        New Israel High School<br>
        Student Safety & Reporting System
      </p>

      <button onclick="showStudentType()">NEXT</button>

    </div>
  </div>


  <!-- STUDENT TYPE SCREEN -->
  <div class="screen hidden" id="studentScreen">
    <div class="box">

      <h1>WELCOME!</h1>

      <p>
        What type of student are you?
      </p>

      <button class="choice" onclick="selectLevel('Elementary')">
        🏫 ELEMENTARY
        <br>
        <small>Grades 1–6</small>
      </button>

      <button class="choice" onclick="selectLevel('Junior High School')">
        🎓 JUNIOR HIGH SCHOOL
        <br>
        <small>Grades 7–10</small>
      </button>

      <button class="choice" onclick="selectLevel('Senior High School')">
        🎓 SENIOR HIGH SCHOOL
        <br>
        <small>Grades 11–12</small>
      </button>

    </div>
  </div>


  <script>

    function showStudentType() {
      document.getElementById("welcomeScreen").classList.add("hidden");
      document.getElementById("studentScreen").classList.remove("hidden");
    }

    function selectLevel(level) {
      alert("Selected: " + level);
    }

  </script>

</body>
</html>
